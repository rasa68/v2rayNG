name: Build and Release (rasa)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes (optional)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.0.1
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode signing keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.RASA_KEYSTORE_BASE64 }}
      run: |
        test -n "$KEYSTORE_BASE64" || { echo "::error::RASA_KEYSTORE_BASE64 secret is missing"; exit 1; }
        echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks

    - name: Set version (every build must be newer than the last so it installs as an update)
      id: version
      run: |
        GRADLE=V2rayNG/app/build.gradle.kts
        BASE_CODE=$(grep -oP 'versionCode = \K[0-9]+' $GRADLE)
        BASE_NAME=$(grep -oP 'versionName = "\K[0-9]+(\.[0-9]+)*' $GRADLE)
        N=${{ github.run_number }}
        sed -i "s/versionCode = $BASE_CODE/versionCode = $((BASE_CODE + N))/" $GRADLE
        sed -i "s/versionName = \"$BASE_NAME\"/versionName = \"$BASE_NAME.$N\"/" $GRADLE
        sed -i 's/"v2rayNG_/"rasa_/g' $GRADLE
        echo "version=$BASE_NAME.$N" >> $GITHUB_OUTPUT
        grep -n "versionCode\|versionName" $GRADLE | head -4

    - name: Build APK
      env:
        KS_PASS: ${{ secrets.RASA_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.RASA_KEY_ALIAS }}
        KEY_PASS: ${{ secrets.RASA_KEY_PASSWORD }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport
        set +e
        ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.jks -Pandroid.injected.signing.store.password="$KS_PASS" -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASS" 2>&1 | tee gradle.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ]; then
          grep -E "^e: |error:|What went wrong" -A2 gradle.log | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
        fi
        exit $status
    
    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk


  release:
    if: false
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          mkdir -p files
          find release -type f -name '*.apk' -exec cp {} files/ \;
          ls -la files
          gh release create "v$VERSION" files/*.apk \
            --target "${{ github.sha }}" \
            --title "rasa $VERSION" \
            --notes "${NOTES:-rasa $VERSION. Signed with the rasa release key, so it installs over the previous rasa build as an update.}" \
            --latest
